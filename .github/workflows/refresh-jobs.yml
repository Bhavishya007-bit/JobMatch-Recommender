name: Refresh real job listings
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download new employer ATS postings
        run: python refresh_snapshot.py
      - name: Commit only updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent_jobs.json data/provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh real ATS job snapshot"
            git push
          fi
